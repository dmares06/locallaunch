<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocalLaunch Demo</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <h1>LocalLaunch Demo</h1>
    <p class="demo">Local demo. Use sample data only.</p>
    <form id="booking">
      <label>Your name<input name="name" autocomplete="name" maxlength="200" required></label>
      <label>Email<input name="email" type="email" autocomplete="email" maxlength="254" required></label>
      <label>Booking time (your local time)<input name="slot" type="datetime-local" required></label>
      <button type="submit">Book</button>
    </form>
    <p id="result" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
