name: Verify LocalLaunch
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Database, security, and scheduling regressions
        run: docker compose --profile test run --build --rm test-runner
      - name: Public routes and privacy smoke checks
        run: ./tests/run_booking_test.sh
      - name: Install browser test dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Owner onboarding and customer booking in a real browser
        working-directory: frontend
        run: npm run test:e2e
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop the test stack
        if: always()
        run: docker compose down --volumes
